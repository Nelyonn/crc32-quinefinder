name: compile

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Package
      uses: ConorMacBride/install-package@v1.1.0
      with:
        apt: zlib1g-dev
    - name: make
      run: make
